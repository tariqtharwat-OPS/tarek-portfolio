<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Research evidence chain visual</title><desc id="d">A designed portfolio visual based on selected project evidence.</desc><rect width="100%" height="100%" rx="30" fill="#f3f5f2"/><rect x="28" y="28" width="1144" height="704" rx="23" fill="white" stroke="#dbe2e5"/><text x="76" y="91" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2f8a7c">SINYAL PASAR TERKINI  /  FAO GLOBEFISH · 23 JULI 2026</text><text x="76" y="145" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#0c243b">Permintaan hasil laut berbeda menurut bentuk produk.</text><text x="76" y="183" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#637588">Pada 2025, tren produk utuh beku dan produk bernilai lebih tinggi berbeda.</text><rect x="76" y="220" width="1048" height="205" rx="15" fill="#f8faf8" stroke="#e1e8e5"/><text x="101" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#637588">PERDAGANGAN TUNA GLOBAL · 2025 VS 2024</text><text x="104" y="302" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#17466a">−8.3%</text><text x="104" y="336" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#182a3b">Tuna utuh beku</text><text x="104" y="366" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Volume impor</text><path d="M104 389h245" stroke="#17466a" stroke-width="7" stroke-linecap="round"/><text x="441" y="302" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2f8a7c">+5.47%</text><text x="441" y="336" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#182a3b">Fillet tuna beku</text><text x="441" y="366" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#6