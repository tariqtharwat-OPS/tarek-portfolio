<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Research evidence chain visual</title><desc id="d">A designed portfolio visual based on selected project evidence.</desc><rect width="100%" height="100%" rx="30" fill="#f3f5f2"/><rect x="28" y="28" width="1144" height="704" rx="23" fill="white" stroke="#dbe2e5"/><text x="76" y="91" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#2f8a7c">CURRENT MARKET SIGNAL  /  FAO GLOBEFISH · 23 JULY 2026</text><text x="76" y="145" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#0c243b">Seafood demand depends on the product form.</text><text x="76" y="183" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500" fill="#637588">In 2025, whole-frozen and higher-value products moved in different directions.</text><rect x="76" y="220" width="1048" height="205" rx="15" fill="#f8faf8" stroke="#e1e8e5"/><text x="101" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#637588">GLOBAL TUNA TRADE · 2025 VS 2024</text><text x="104" y="302" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#17466a">−8.3%</text><text x="104" y="336" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#182a3b">Whole frozen tuna</text><text x="104" y="366" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Import volume</text><path d="M104 389h245" stroke="#17466a" stroke-width="7" stroke-linecap="round"/><text x="441" y="302" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2f8a7c">+5.47%</text><text x="441" y="336" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#182a3b">Frozen tuna fillets</text><text x="441" y="366" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Import volume</text><path d="M441 389h245" stroke="#2f8a7c" stroke-width="7" stroke-linecap="round"/><text x="778" y="302" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#d9aa58">+8.91%</text><text x="778" y="336" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#182a3b">Prepared / preserved</text><text x="778" y="366" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Import volume</text><path d="M778 389h245" stroke="#d9aa58" stroke-width="7" stroke-linecap="round"/><rect x="76" y="447" width="1048" height="60" rx="15" fill="#edf4f1" stroke="#d8e5df"/><text x="98" y="484" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="650" fill="#17466a">Research implication: compare species and product form separately; a single category trend can hide a shift.</text><text x="76" y="553" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="650" fill="#0c243b">A traceable research path</text><rect x="76" y="578" width="190" height="112" rx="15" fill="#f8faf8" stroke="#e1e8e5"/><text x="90" y="613" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#0c243b">Question</text><text x="90" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Scope the buyer decision</text><rect x="287" y="578" width="190" height="112" rx="15" fill="#fff" stroke="#e1e8e5"/><text x="301" y="613" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#0c243b">Sources</text><text x="301" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Current, dated references</text><rect x="498" y="578" width="190" height="112" rx="15" fill="#f8faf8" stroke="#e1e8e5"/><text x="512" y="613" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#0c243b">Definitions</text><text x="512" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Species, form and codes</text><rect x="709" y="578" width="190" height="112" rx="15" fill="#fff" stroke="#e1e8e5"/><text x="723" y="613" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#0c243b">Comparison</text><text x="723" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Like with like</text><rect x="920" y="578" width="190" height="112" rx="15" fill="#f8faf8" stroke="#e1e8e5"/><text x="934" y="613" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="650" fill="#0c243b">Brief</text><text x="934" y="645" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">Finding + next step</text><text x="78" y="724" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#637588">FAO GLOBEFISH tuna trade report, 23 Jul 2026 · Trade-flow context, not a supplier or destination recommendation.</text></svg>